    /* ===== Player-only Loader (scoped & small) =====

    #playerLoader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;                 /* black background inside player box */
      z-index: 11000;                    /* above controls */
      visibility: hidden;
      opacity: 0;
      transition: opacity 180ms ease, visibility 180ms;
      pointer-events: none;
    }

    /* visible state */
    #playerLoader.show {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* loader container — no scaling, just flex column */
    #playerLoader .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* SVG sizing inside loader — base size for mobile */
    #playerLoader .loading-svg {
      width: 75px;   /* adjust spinner size on mobile */
      height: 75px;
      display: block;
      margin-top: 15px;
    }

    /* Loader text style (small on mobile) */
    #playerLoader .loader-text {
      font-family: 'Roboto', sans-serif;

      background: linear-gradient(93deg, #c40a4e 0%, #410675 90%);  /* other colour  */

      -webkit-text-fill-color: transparent;

      margin-top: 5px;    /* gap between spinner and text */

    /* --- Responsive adjustments for larger screens --- */

    #playerLoader .arc-line {
      stroke: url(#arc-gradient-player);

    /* Rotation animations (scoped) */

    @keyframes rotate-cw { 100% { transform: rotate(360deg); } }

<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");
const video = params.get("video");
const videoID = params.get("videoID");
const provider = params.get("provider");
const noSkip = params.has("noskip");     //   ✅ Force to Not Skip the Video
const skipSeconds = parseFloat(params.get("skip"));        //   ✅ Flexible Skip Timing for " skipSeconds " using Videos
const skipSecondsFinal = Number.isFinite(skipSeconds) ? skipSeconds : 13.8;      //   ✅ Default = 13.8s Skip

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [
    h > 0 ? h.toString().padStart(2, '0') : null,
    m.toString().padStart(2, '0'),
    s.toString().padStart(2, '0')
  ].filter(Boolean).join(':');
}

if (title) {
  const decoded = decodeURIComponent(title);
  document.getElementById("videoTitle").textContent = decoded;
  document.title = decoded;
}

const wrapper = document.getElementById("playerWrapper");


//   Main Player Load & Gesture Zone Injection
if (provider === "youtube" && videoID) {
  wrapper.innerHTML += `
    <div class="relative aspect-video rounded w-full h-full">
      <div class="plyr__video-embed" id="player">
        <iframe
          src="https://www.youtube.com/embed/${videoID}?autoplay=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&playsinline=1&enablejsapi=1&controls=0&showinfo=0"
          allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div id="gestureLeft" class="gesture-zone"></div>
      <div id="gestureRight" class="gesture-zone"></div>
    </div>`;
} else if (provider === "html5" && video) {
  wrapper.innerHTML += `
    <div class="relative aspect-video rounded w-full h-full">
      <video id="player" class="rounded w-full h-full" style="background:black;">
        <source src="${decodeURIComponent(video)}" type="video/mp4" />
      </video>
      <div id="gestureLeft" class="gesture-zone"></div>
      <div id="gestureRight" class="gesture-zone"></div>
    </div>`;
} else if (provider === "hls" && video) {
  //   NEW HLS BLOCK  :  No Source Tag ;  HLS.js  Feeds The Video Element Directly
  //   NATIVE SPINNER FIX  :  Removed The  ' controls '  Attribute
  wrapper.innerHTML += `
    <div class="relative aspect-video rounded w-full h-full">
      <video id="player" class="rounded w-full h-full" style="background:black;" playsinline></video>
      <div id="gestureLeft" class="gesture-zone"></div>
      <div id="gestureRight" class="gesture-zone"></div>
    </div>`;
}


//   Ensure Gesture Zones Never Overlap The Controls
function syncGestureZoneBottomToControls() {
  const controls = document.querySelector('.plyr__controls');
  const zones = Array.from(document.querySelectorAll('.gesture-zone'));
  if (!controls || !zones.length) return;
  const controlHeight = Math.ceil(controls.getBoundingClientRect().height || 56);
  zones.forEach(z => {
    z.style.bottom = `${controlHeight}px`;
    z.style.height = 'auto'; 
  });
}

//   Run Initially & Whenever Layout May Change
window.addEventListener('resize', syncGestureZoneBottomToControls);
//   Note  :  player.on  Attached Lower Down After Player Init

//   Run a Couple of Times To Catch Layout Shifts on  Mobile / Slow  Render
setTimeout(syncGestureZoneBottomToControls, 120);
setTimeout(syncGestureZoneBottomToControls, 450);


//   =========================================================================
//   ===   HLS.JS  INITIALIZATION  &  DYNAMIC  QUALITY  &  PLAYER  SETUP   ===
//   =========================================================================
const videoElement = document.getElementById('player');

const plyrConfig = {
  controls: [
    'play-large', 'play', 'progress', 'current-time',
    'duration', 'mute', 'captions', 'settings', 'fullscreen'
  ],
  //   ' quality '  is Placed First So It Appears Above  ' speed '
  settings: ['quality', 'speed', 'volume'],
  toggleInvert: true,           
  speed: {
    selected: 1,
    options: [0.75, 1, 1.15, 1.25, 1.45, 1.6, 1.75, 2]
  },
  //   👇🏻  YOUTUBE UI FIX  :  Forcing Plyr To Enforce The  Zero - Controls  Policy
  youtube: { modestbranding: 1, rel: 0, noCookie: true, controls: 0, iv_load_policy: 3, showinfo: 0 }
};

//   We Wrap All Event Listeners in a Function So They Wait For Dynamic Qualities To Load
function initAllPlayerEvents(plyrInstance) {
  window.player = plyrInstance;

  player.on('ready', syncGestureZoneBottomToControls);
  syncGestureZoneBottomToControls();

  //   ------------------------------------------------------------------
  //   Loader controller
  //   ------------------------------------------------------------------
  const myLoader = document.getElementById('playerLoader');
  const isYouTube = provider === 'youtube';
  let hideLoaderTimer = null;
  let firstPlayablePaintSeen = false;

  function showCustomLoader(reason = '') {
    if (!myLoader) return;
    clearTimeout(hideLoaderTimer);
    myLoader.classList.add('show');
  }

  function hideCustomLoader({ immediate = false } = {}) {
    if (!myLoader) return;

    clearTimeout(hideLoaderTimer);

    const doHide = () => {
      myLoader.classList.remove('show');
    };

    //   For YouTube ,  Never Remove The Overlay in The Same Moment The Player
    //   Becomes  " Ready " .  A Tiny Delay + 2x rAF Prevents Branding/UI Flash .
    if (immediate) {
      doHide();
      return;
    }

    const delay = isYouTube ? 220 : 80;
    hideLoaderTimer = setTimeout(() => {
      requestAnimationFrame(() => {
        requestAnimationFrame(doHide);
      });
    }, delay);
  }

  //   Start With The Loader Visible For Every Provider .
  //   This Prevents The YouTube Iframe From Flashing Its Own Startup UI .
  showCustomLoader('startup');

  //   Generic  Buffering / Network  Events .
  player.on('loadstart', showCustomLoader);
  player.on('waiting', showCustomLoader);
  player.on('seeking', showCustomLoader);
  player.on('stalled', showCustomLoader);

  //   Non - YouTube  Players Can Safely Hide a Bit Earlier .
  if (!isYouTube) {
    player.on('ready', () => hideCustomLoader());
    player.on('canplay', () => hideCustomLoader());
    player.on('loadeddata', () => hideCustomLoader());
    player.on('playing', () => {
      firstPlayablePaintSeen = true;
      hideCustomLoader();
    });
    player.on('seeked', () => hideCustomLoader());
    player.on('pause', () => hideCustomLoader());
  }

  player.on('error', () => hideCustomLoader({ immediate: true }));

  //   YouTube Internal State Mapping :
  //   3 = Buffering ,  1 = Playing ,  2 = Paused
  player.on('statechange', (event) => {
    const code = Number(event?.detail?.code);

    if (code === 3) {
      showCustomLoader('youtube-buffering');
      return;
    }

    if (code === 1) {
      firstPlayablePaintSeen = true;
      hideCustomLoader();
      return;
    }

    //   Keep The Loader Up During The First Paused State So The YouTube UI
    //   Does Not Flash Through Before The Real Video Surface is Ready .
    if (code === 2 && isYouTube && !firstPlayablePaintSeen) {
      showCustomLoader('youtube-first-paused-state');
    }
  });

  //   YouTube Sometimes Emits Play Before Its Iframe Finishes Painting .
  player.on('play', () => {
    if (isYouTube) showCustomLoader('youtube-play');
  });

//   Gesture Logic NOT Affected
function initGestures(type) {
  setupGestureZone('gestureLeft', -10);
  setupGestureZone('gestureRight', 10);
  function setupGestureZone(zoneId, seekAmountDefault) {
    const zone = document.getElementById(zoneId);
    let lastTap = 0, isHolding = false, holdTimeout = null, startX = 0;
    let gestureStartTime = 0;
    zone.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      gestureStartTime = player.media.currentTime;
      isHolding = false;
      holdTimeout = setTimeout(() => isHolding = true, 1500);
    }, { passive: false });
    zone.addEventListener('touchmove', function(e) {
      if (isHolding) {
        let dx = e.touches[0].clientX - startX;
        let seekAmount = dx / 10;
        seekBy(seekAmount);
        let targetTime = gestureStartTime + seekAmount;
        let formattedTime = formatTime(targetTime);
        showToast(seekAmount > 0 ? `>> ${formattedTime}` : `<< ${formattedTime}`);
        vibrate();
        e.preventDefault();
      }
    }, { passive: false });
    zone.addEventListener('touchend', function(e) {
      clearTimeout(holdTimeout);
      const now = Date.now();
      if (!isHolding && now - lastTap < 300) {
        seekBy(seekAmountDefault);
        showToast(seekAmountDefault < 0 ? '⏪ -10s' : '⏩ +10s');
        vibrate();
      }
      lastTap = now;
      isHolding = false;
    });
    zone.addEventListener('dblclick', e => {
      e.preventDefault();
      e.stopPropagation();
    });
  }
}

function seekBy(seconds) {
  const c = player.media?.currentTime || 0;
  player.media.currentTime = Math.max(0, Math.min(player.media.duration || Infinity, c + seconds));
}
function vibrate() { if (navigator.vibrate) navigator.vibrate(15); }
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast._timeout);
  showToast._timeout = setTimeout(() => toast.classList.remove('show'), 900);
}

function setupMenuOverlayBlock() {
  const plyrRoot = document.querySelector('.plyr');
  const gestureLeft = document.getElementById('gestureLeft');
  const gestureRight = document.getElementById('gestureRight');
  if (!plyrRoot || !gestureLeft || !gestureRight) return;
  const observer = new MutationObserver(() => {
    const menuOpen = plyrRoot.classList.contains('plyr--menu-open');
    [gestureLeft, gestureRight].forEach(zone => {
      zone.style.pointerEvents = menuOpen ? 'none' : 'auto';
    });
  });
  observer.observe(plyrRoot, { attributes: true, attributeFilter: ['class'] });
  const menuOpen = plyrRoot.classList.contains('plyr--menu-open');
  [gestureLeft, gestureRight].forEach(zone => {
    zone.style.pointerEvents = menuOpen ? 'none' : 'auto';
  });
}

function injectCustomSeekControls() {
  const controls = document.querySelector('.plyr__controls');
  if (!controls) return;
  if (document.getElementById('customSeekControls')) return;

  const container = document.createElement('div');
  container.id = 'customSeekControls';

  //   Standard Plyr SVG For  Backward / Forward
  const svgRewind = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6.5 10.76V16L1 10L6.5 4V7.1C12.5 7.48 17 9.28 19 13.74C17.18 12.04 12.5 11.16 7 11.15C6.83 11.15 6.66 11.14 6.5 11.13V10.76Z" fill="#fff"/></svg>`;
  const svgForward = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13.5 10.76V16L19 10L13.5 4V7.1C7.5 7.48 3 9.28 1 13.74C2.82 12.04 7.5 11.16 13 11.15C13.17 11.15 13.34 11.14 13.5 11.13V10.76Z" fill="#fff"/></svg>`;

  function createSeekBtn(icon, label) {

    btn.style.padding = '0 4px';
    btn.style.height = '31px';
    btn.style.width = '31px';
    return btn;
  }

  // Seek interval Middle Button
  const intervalBtn = document.createElement('button');
  intervalBtn.type = 'button';
  intervalBtn.className = 'plyr__control plyr__control--seek';
  intervalBtn.textContent = '10s';
  intervalBtn.title = 'Select seek interval';
  intervalBtn.style.background = 'rgba(30,30,30,0.5)';    //   ✅ Same as back/forward buttons by default
  intervalBtn.style.color = '#fff';
  intervalBtn.style.fontWeight = 'bold';
  intervalBtn.style.borderRadius = '4px';
  intervalBtn.style.padding = '0 4px';
  intervalBtn.style.minWidth = '31px';
  intervalBtn.style.minHeight = '31px';

  // Seek interval menu
  const seekIntervalMenu = document.createElement('div');
  seekIntervalMenu.id = 'seekIntervalMenu';
  seekIntervalMenu.style.display = 'none';
  seekIntervalMenu.classList.add('menu-animate');

  const seekIntervals = [100, 85, 65, 50, 40, 30, 20, 10];
  let selectedInterval = 10;
  function updateIntervalBtnLabel() { intervalBtn.textContent = `${selectedInterval}s`; }
  seekIntervals.forEach(interval => {
    const btn = document.createElement('button');
    btn.className = 'plyr__control interval-btn';
    btn.textContent = `${interval}s`;
    btn.style.margin = "2px 6px";
    btn.style.borderRadius = '5px';
    btn.style.minWidth = '100px';

    // Add "selected" class for initial selection
    if (interval === selectedInterval) {
      btn.classList.add('selected');
    }

    btn.onclick = () => {
      selectedInterval = interval;
      updateIntervalBtnLabel();
      // Remove 'selected' class from all buttons
      Array.from(seekIntervalMenu.children).forEach(b => b.classList.remove('selected'));
      // Add 'selected' class to clicked button
      btn.classList.add('selected');
      seekIntervalMenu.style.display = 'none';
    }
    seekIntervalMenu.appendChild(btn);
  });

  intervalBtn.onclick = function(e){
    e.stopPropagation();
    const isOpen = seekIntervalMenu.style.display === "flex";

    //   👇🏻 Hide other menus before showing interval menu
    closeAllMenus('seekIntervalMenu');

    //   🎊 Toggle visibility (no need for dynamic positioning)
    if (isOpen) {
      instantHideMenu(seekIntervalMenu);
    } else {
      positionSeekMenu();   // compute left/bottom before making menu visible
      seekIntervalMenu.style.display = 'flex';
      setTimeout(() => {
        seekIntervalMenu.classList.add('menu-show');
        setIntervalBtnHighlight(true);    //   ✅ Add highlight when opening
      }, 10);
    }

    //   ✅ Lock gesture controls while menu is open
    const gestureLeft = document.getElementById('gestureLeft');

      gestureLeft.style.pointerEvents = "none";
      gestureRight.style.pointerEvents = "none";

      gestureRight.style.pointerEvents = "auto";

  // Seek buttons
  const btnBack = createSeekBtn(svgRewind, "Seek backward");
  const btnForward = createSeekBtn(svgForward, "Seek forward");
  btnBack.onclick = () => { seekBy(-selectedInterval); showToast(`⏪ -${selectedInterval}s`); vibrate(); }
  btnForward.onclick = () => { seekBy(selectedInterval); showToast(`⏩ +${selectedInterval}s`); vibrate(); }

  container.appendChild(btnBack);
  container.appendChild(intervalBtn);
  container.appendChild(btnForward);
  // append the interval menu inside the controls so absolute positioning is relative to the controls
  document.body.appendChild(seekIntervalMenu);

  /* ---------- position helper: align menu above the interval button ---------- */
  function positionSeekMenu() {
  // show briefly for measurement, but keep hidden to avoid flicker
  seekIntervalMenu.style.display = 'block';
  seekIntervalMenu.style.visibility = 'hidden';
  seekIntervalMenu.classList.remove('menu-show');

  requestAnimationFrame(() => {
    const btnRect = intervalBtn.getBoundingClientRect();
    const menuWidth = seekIntervalMenu.offsetWidth;
    const menuHeight = seekIntervalMenu.offsetHeight;

    // horizontal nudge: tweak per device size (recalculated each time)
    // --- horizontal nudge (keep this, like in your current code) ---  
    const horizontalNudge = 33; // tweak to shift left/right  
    const verticalOffset = 15; // gap between button and menu (tweak to taste)

    // If menu is appended to body -> compute viewport coordinates
    if (seekIntervalMenu.parentElement === document.body) {
      let left = btnRect.left + window.scrollX + (btnRect.width / 2) - (menuWidth / 2) - horizontalNudge;
      // clamp to viewport
      left = Math.max(6, Math.min(left, window.innerWidth - menuWidth - 6));

      // place above the button; if not enough space, place below
      let top = btnRect.top + window.scrollY - menuHeight - verticalOffset;
      if (top < 6) top = btnRect.bottom + window.scrollY + verticalOffset;

      seekIntervalMenu.style.position = 'absolute';
      seekIntervalMenu.style.left = `${Math.round(left)}px`;
      seekIntervalMenu.style.top = `${Math.round(top)}px`;
      // ensure we clear bottom if previously used
      seekIntervalMenu.style.bottom = '';
    } else {
      // Menu is inside a parent (e.g. controls) — compute coords relative to that parent
      const parentRect = seekIntervalMenu.parentElement.getBoundingClientRect();

      // left relative to parent
      let left = (btnRect.left - parentRect.left) + (btnRect.width / 2) - (menuWidth / 2) - horizontalNudge;

      // clamp inside parent
      left = Math.max(6, Math.min(left, Math.max(6, parentRect.width - menuWidth - 6)));

      // top relative to parent: place above the button. If not enough space, place below.
      let top = (btnRect.top - parentRect.top) - menuHeight - verticalOffset;
      if (top < 6) top = (btnRect.bottom - parentRect.top) + verticalOffset;

      seekIntervalMenu.style.position = 'absolute';
      seekIntervalMenu.style.left = `${Math.round(left)}px`;
      seekIntervalMenu.style.top = `${Math.round(top)}px`;
      seekIntervalMenu.style.bottom = '';
    }

    // restore visibility (menu-show is toggled elsewhere to animate)
    seekIntervalMenu.style.visibility = '';
  });
  }

  // re-position while open if the window is resized
  ['resize', 'orientationchange', 'fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
    window.addEventListener(evt, () => {
      if (seekIntervalMenu.style.display !== 'none') {
        positionSeekMenu();
      }
    });
  });

  // Place right after mute button for consistent layout
  const muteBtn = controls.querySelector('[data-plyr="mute"]');
  muteBtn?.insertAdjacentElement('afterend', container);

  // Hide interval menu on outside click
  document.addEventListener('click', function(ev){
    if (!seekIntervalMenu.contains(ev.target) &&
        ev.target !== intervalBtn
    ) {
      instantHideMenu(seekIntervalMenu);
      setIntervalBtnHighlight(false);       //   ✅ Reset highlight on outside click
      // restore gesture zones when menu closes
      const gestureLeft = document.getElementById('gestureLeft');
      const gestureRight = document.getElementById('gestureRight');
      if (gestureLeft && gestureRight) {
        gestureLeft.style.pointerEvents = "auto";
        gestureRight.style.pointerEvents = "auto";
      }
    }
  });

  // handle fullscreen toggling: move menu to best parent and reposition
  function handleFullscreenMove() {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (isFullscreen) {
      // append to the plyr root wrapper (fullscreen element), not controls
      const plyrRoot = controls.closest('.plyr');
      plyrRoot.appendChild(seekIntervalMenu);
    } else {
      // back to body so it can overflow outside player in normal mode
      document.body.appendChild(seekIntervalMenu);
    }

    if (seekIntervalMenu.style.display !== 'none') {
      requestAnimationFrame(positionSeekMenu);
    }
  }

  // listen for full-screen changes (standard + webkit)
  document.addEventListener('fullscreenchange', handleFullscreenMove);
  document.addEventListener('webkitfullscreenchange', handleFullscreenMove);
}

// ========== INLINE VOLUME SLIDER ==========

function injectInlineVolumeSlider() {
  const controls = document.querySelector('.plyr__controls');
  if (!controls) return;
  if (document.getElementById('inlineVolumeSlider')) return;
  const muteBtn = controls.querySelector('[data-plyr="mute"]');
  if (!muteBtn) return;

  // Create the slider container
  const volContainer = document.createElement('div');
  let volumeAutoHideTimeout = null;
  volContainer.id = 'inlineVolumeSlider';
  volContainer.style.display = 'none';
  volContainer.classList.add('menu-animate');

  // Vertical slider
  const volumeSlider = document.createElement('input');
  volumeSlider.type = 'range';
  volumeSlider.min = 0; volumeSlider.max = 1; volumeSlider.step = 0.01; volumeSlider.value = 1;

  volContainer.appendChild(volumeSlider);
  muteBtn.insertAdjacentElement('afterend', volContainer);

  // Show slider when mute/volume button is clicked, set volume to 100%
  muteBtn.addEventListener('click', (e) => {
    e.preventDefault();

    const isOpen = volContainer.style.display === 'flex' && volContainer.classList.contains('menu-show');

    if (isOpen) {
      //   ✅  If Open ,  Hide Instantly & Clear Timer
      instantHideMenu(volContainer);
      muteBtn.style.background = '';
      if (volumeAutoHideTimeout) {
        clearTimeout(volumeAutoHideTimeout);
        volumeAutoHideTimeout = null;
      }
    } else {
      //   ✅  Show Volume Slider
      closeAllMenus('inlineVolumeSlider');
      player.muted = false;
      player.volume = 1;
      volumeSlider.value = 1;
      volContainer.style.display = 'flex';
      setTimeout(() => volContainer.classList.add('menu-show'), 10);
      muteBtn.style.background = '#14b9ff';       //   😍  <==  Apply Your Desired Background Color Here

      //   ✅  Clear Any Existing Timer Before Setting New One
      if (volumeAutoHideTimeout) clearTimeout(volumeAutoHideTimeout);
  
      //   ✅  Set New  Auto - Hide  Timer For 8 Seconds
      volumeAutoHideTimeout = setTimeout(() => {
        instantHideMenu(volContainer);
        muteBtn.style.background = '';
        volumeAutoHideTimeout = null;
      }, 8000);        //   ⏳  Auto Hides The Volume Slidebar After 8 Seconds
    }
  });

  //   Volume Slider Logic
  volumeSlider.addEventListener('input', function(){
    player.volume = this.value;
    player.muted = (Number(this.value) < 0.01);
  });

  player.on('volumechange', () => {
    volumeSlider.value = player.volume;
  });

  //   Hide Slider On Outside Click
  document.addEventListener('click', function(ev){
    if (!volContainer.contains(ev.target) &&
        ev.target !== muteBtn
    ) {
      instantHideMenu(volContainer);
      if (volumeAutoHideTimeout) {
        clearTimeout(volumeAutoHideTimeout);
        volumeAutoHideTimeout = null;
      }
      muteBtn.style.background = '';
    }
  });
}


//   ======  Current Session Card Logic  ======
//   Robust Replacement For :
//   -  Current Watched Time
//   -  Total Duration
//   -  YouTube Live Fallback
//   -  Progress Cards
//   -  Buffering / Seeking Sync
//
//   This Version Uses :
//   1 )  Event Listeners
//   2 )  A Small Polling Loop
//   3 )  YouTube embed API Fallbacks
//   So Live Streams Do Not Stay Stuck At 00:00:00:00 .

const sessionStatusDot = document.getElementById("sessionStatusDot");
const sessionCurrentTime = document.getElementById("sessionCurrentTime");
const sessionTotalDuration = document.getElementById("sessionTotalDuration");

let sessionTimer = null;
let watchedMilliseconds = 0;
let lastTick = null;

let isMetadataLoaded = false;
let isBufferingOrSeeking = false;

let watchdogIntervalId = null;
let lastObservedTime = 0;
let timeStuckSince = null;
const TIME_STUCK_THRESHOLD_MS = 900;
const WATCHDOG_INTERVAL_MS = 500;

let uiPollIntervalId = null;
let sessionTrackingBound = false;
let progressTrackingBound = false;


//   Format Time Helper → HH:MM:SS:MS
function formatSessionTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const milliseconds = Math.floor(ms % 1000 / 10);

  return [
    hours.toString().padStart(2, "0"),
    minutes.toString().padStart(2, "0"),
    seconds.toString().padStart(2, "0"),
  ].join(":") + ":" + milliseconds.toString().padStart(2, "0");
}


function setSessionDotState(state) {
  sessionStatusDot.classList.remove("bg-green-600", "bg-red-600", "bg-yellow-900");
  if (state === "playing") sessionStatusDot.classList.add("bg-green-600");
  else if (state === "buffering") sessionStatusDot.classList.add("bg-yellow-900");
  else sessionStatusDot.classList.add("bg-red-600");
}


function startSessionTimer() {
  if (sessionTimer) return;
  lastTick = Date.now();
  sessionTimer = setInterval(() => {
    const now = Date.now();
    const delta = Math.max(0, now - lastTick);
    watchedMilliseconds += delta;
    lastTick = now;
    sessionCurrentTime.textContent = formatSessionTime(watchedMilliseconds);
  }, 50);
}


function stopSessionTimer() {
  if (!sessionTimer) return;
  clearInterval(sessionTimer);
  sessionTimer = null;
}


function enterBuffering() {
  if (isBufferingOrSeeking) return;
  isBufferingOrSeeking = true;
  stopSessionTimer();
  setSessionDotState("buffering");
}


function exitBuffering() {
  if (!isBufferingOrSeeking) return;
  isBufferingOrSeeking = false;
  setSessionDotState(player.paused ? "paused" : "playing");
  if (!player.paused && isMetadataLoaded) {
    startSessionTimer();
  }
}

//   Resolve  Duration / Current  Time Reliably For HTML5 ,  HLS & YouTube .
function resolvePlaybackSnapshot() {
  let dur = Number(player?.duration || 0);
  let cur = Number(player?.currentTime || 0);
  let isYtLive = false;

  if (player?.provider === 'youtube' && player.embed) {
    try {
      const data = player.embed.getVideoData?.();
      isYtLive = !!data?.isLive;

      const ytDur = Number(player.embed.getDuration?.() || 0);
      const ytCur = Number(player.embed.getCurrentTime?.() || 0);

      if (Number.isFinite(ytDur) && ytDur > 0) dur = ytDur;
      if (Number.isFinite(ytCur) && ytCur >= 0) cur = ytCur;

      //   Extra Live Fallback  :  Some Live Streams Do Not Report isLive Immediately .
      if (!isYtLive && player.provider === 'youtube' && player.playing && ytCur > 0 && (!ytDur || ytDur === 0)) {
        isYtLive = true;
      }
    } catch (err) {
      //   Keep The Generic Player Values If The iframe API is Not Ready Yet .
    }
  }

  return { dur, cur, isYtLive };
}

//   Progress Card Helpers
function formatPercent(value) {
  const fixed = value.toFixed(2);
  const [intPart, decPart] = fixed.split('.');
  const paddedInt = intPart.padStart(2, '0');
  return `${paddedInt}.${decPart}`;
}

function setInitialUI() {
  leftFill.style.width = '0%';
  rightFill.style.width = '100%';
  leftPercentEl.textContent = '0%  Watched';
  rightPercentEl.textContent = '100%  Remaining';
}

function renderProgressCards(dur, cur, isYtLive) {
  //   Live Streams  :  Always Show  Full Watched / Zero Remaining .
  if (isYtLive) {
    leftFill.style.width = '100%';
    rightFill.style.width = '0%';
    leftPercentEl.textContent = '100%   Watched';
    rightPercentEl.textContent = '0%   Remaining';
    if (window.watchedWave) window.watchedWave.update(1);
    if (window.remainingWave) window.remainingWave.update(0);
    return;
  }

  //   Unknown Duration  :  keep a Stable Placeholder State .
  if (!dur || !Number.isFinite(dur) || dur === 0) {
    leftFill.style.width = '0%';
    rightFill.style.width = '100%';
    leftPercentEl.textContent = '0%   Watched';
    rightPercentEl.textContent = '100%   Remaining';
    if (window.watchedWave) window.watchedWave.update(0);
    if (window.remainingWave) window.remainingWave.update(1);
    return;
  }

  const frac = Math.max(0, Math.min(1, cur / dur));
  const watchedPct = frac * 100;
  const remPct = 100 - watchedPct;

  if (cur === 0) {
    leftFill.style.width = '0%';
    rightFill.style.width = '100%';
    leftPercentEl.textContent = '0%   Watched';
    rightPercentEl.textContent = '100%   Remaining';
  } else if (Math.abs(cur - dur) < 0.01 || watchedPct >= 100) {
    leftFill.style.width = '100%';
    rightFill.style.width = '0%';
    leftPercentEl.textContent = '100%   Watched';
    rightPercentEl.textContent = '0%   Remaining';
  } else {
    leftFill.style.width = `${watchedPct.toFixed(2)}%`;
    rightFill.style.width = `${remPct.toFixed(2)}%`;
    leftPercentEl.textContent = `${formatPercent(watchedPct)} %   Watched`;
    rightPercentEl.textContent = `${formatPercent(remPct)} %   Remaining`;
  }

  if (window.watchedWave) window.watchedWave.update(frac);
  if (window.remainingWave) window.remainingWave.update(1 - frac);
}


function updateSessionCardAndProgress() {
  if (!window.player) return;

  const { dur, cur, isYtLive } = resolvePlaybackSnapshot();

  //   Consider Metadata  " Loaded "  If We Have Any Real Playback Signal .
  if (dur > 0 || cur > 0 || isYtLive) {
    isMetadataLoaded = true;
  }

  //   Keep The Session Timer Synced With The Actual Playback State .
  if (window.player.paused || window.player.ended) {
    stopSessionTimer();
    if (!isBufferingOrSeeking) setSessionDotState("paused");
  } else if (!isBufferingOrSeeking) {
    setSessionDotState("playing");
    if (!sessionTimer) startSessionTimer();
  }

  //   Current Watched Time Box .
  sessionCurrentTime.textContent = formatSessionTime(watchedMilliseconds);

  //   Total Duration Box .
  if (isYtLive) {
    if (dur > 0 && Number.isFinite(dur)) {
      sessionTotalDuration.textContent = formatSessionTime(Math.floor(dur * 1000));
    } else {
      sessionTotalDuration.textContent = "Live Stream";
    }
  } else if (dur === Infinity) {
    sessionTotalDuration.textContent = "Live Stream";
  } else if (dur > 0 && Number.isFinite(dur)) {
    sessionTotalDuration.textContent = formatSessionTime(Math.floor(dur * 1000));
  } else {
    sessionTotalDuration.textContent = "00:00:00:00";
  }

  renderProgressCards(dur, cur, isYtLive);
  checkLiveDrift(cur, dur, isYtLive);
}


function checkLiveDrift(cur, dur, isYtLive) {
  const liveIndicator = document.getElementById('liveIndicator');
  const liveIndicatorText = document.getElementById('liveIndicatorText');
  const liveIndicatorDot = document.getElementById('liveIndicatorDot');

  if (!liveIndicator) return;

  let isLive = isYtLive;
  let liveEdgeTime = dur;

  //   Detect HLS Live Streams .
  if (window.hls && window.hls.levels && window.hls.levels.length > 0) {
    const levelIndex = window.hls.currentLevel === -1 ? 0 : window.hls.currentLevel;
    const currentLevel = window.hls.levels[levelIndex];

    if (currentLevel && currentLevel.details && currentLevel.details.live) {
      isLive = true;
      liveEdgeTime = window.hls.liveSyncPosition || dur;
    }
  } else if (dur === Infinity) {
    isLive = true;
  }

  if (!isLive) {
    liveIndicator.style.display = 'none';
    return;
  }

  liveIndicator.style.display = 'flex';

  if (isYtLive) {
    liveIndicatorText.textContent = "LIVE";
    liveIndicatorText.style.color = "#16a34a";
    liveIndicatorDot.style.backgroundColor = "#16a34a";
    liveIndicatorDot.style.boxShadow = "0 0 5px #16a34a";
    return;
  }

  const secondsBehind = liveEdgeTime - cur;

  if (secondsBehind <= 12) {
    liveIndicatorText.textContent = "LIVE";
    liveIndicatorText.style.color = "#16a34a";
    liveIndicatorDot.style.backgroundColor = "#16a34a";
    liveIndicatorDot.style.boxShadow = "0 0 5px #16a34a";
  } else {
    liveIndicatorText.textContent = "NOT LIVE";
    liveIndicatorText.style.color = "#ef4444";
    liveIndicatorDot.style.backgroundColor = "#ef4444";
    liveIndicatorDot.style.boxShadow = "0 0 5px #ef4444";
  }
}

//   Click The LIVE Pill To Jump Back To Live Edge .
const liveInd = document.getElementById('liveIndicator');
if (liveInd) {
  liveInd.addEventListener('click', () => {
    if (!window.player) return;

    const isYtLive = (
      window.player.provider === 'youtube' &&
      window.player.embed &&
      typeof window.player.embed.getVideoData === 'function' &&
      window.player.embed.getVideoData().isLive
    );

    if (window.hls && window.hls.liveSyncPosition) {
      window.player.currentTime = window.hls.liveSyncPosition;
    } else if (isYtLive && window.player.duration) {
      if (window.player.embed && window.player.embed.seekTo) {
        window.player.embed.seekTo(window.player.duration, true);
      } else {
        window.player.currentTime = window.player.duration;
      }
    } else if (window.player.duration && window.player.duration !== Infinity) {
      window.player.currentTime = window.player.duration;
    }
  });
}

//   Wrap All Session Events in a Function So They Wait For Player Init .
window.startSessionTracking = function() {
  if (sessionTrackingBound) return;
  sessionTrackingBound = true;

  //   Keep Session Timer Accurate Even If The Browser Skips Some Events .
  if (watchdogIntervalId) clearInterval(watchdogIntervalId);
  watchdogIntervalId = setInterval(() => {
    if (!isMetadataLoaded || !window.player) return;

    if (window.player.paused || window.player.ended) {
      lastObservedTime = Number(window.player.currentTime || 0);
      timeStuckSince = null;
      return;
    }

    const cur = Number(window.player.currentTime || 0);
    if (Math.abs(cur - lastObservedTime) < 0.05) {
      if (!timeStuckSince) timeStuckSince = Date.now();
      else if (Date.now() - timeStuckSince > TIME_STUCK_THRESHOLD_MS) {
        enterBuffering();
      }
    } else {
      timeStuckSince = null;
      if (isBufferingOrSeeking) exitBuffering();
    }
    lastObservedTime = cur;
  }, WATCHDOG_INTERVAL_MS);

  //   Native Metadata Events .
  window.player.media?.addEventListener('loadedmetadata', () => {
    isMetadataLoaded = true;
    updateSessionCardAndProgress();
    if (!window.player.paused && !isBufferingOrSeeking) {
      startSessionTimer();
      setSessionDotState("playing");
    }
  });

  //   Plyr Events .
  window.player.on("play", () => {
    isMetadataLoaded = true;
    setSessionDotState("playing");
    if (!isBufferingOrSeeking) startSessionTimer();
    updateSessionCardAndProgress();
  });

  window.player.on("pause", () => {
    setSessionDotState("paused");
    stopSessionTimer();
    updateSessionCardAndProgress();
  });

  window.player.on("ended", () => {
    setSessionDotState("paused");
    stopSessionTimer();
    updateSessionCardAndProgress();
  });

  window.player.on("seeking", enterBuffering);
  window.player.on("waiting", enterBuffering);
  window.player.on("stalled", enterBuffering);

  window.player.on("playing", exitBuffering);
  window.player.on("canplay", exitBuffering);
  window.player.on("canplaythrough", exitBuffering);

  window.player.on("seeked", () => {
    setTimeout(() => {
      if (!window.player.paused) exitBuffering();
      updateSessionCardAndProgress();
    }, 250);
  });

  //   Native  HTML5  Events Where Available .
  if (window.player.media) {
    window.player.media.addEventListener('seeking', enterBuffering);
    window.player.media.addEventListener('waiting', enterBuffering);
    window.player.media.addEventListener('stalled', enterBuffering);
    window.player.media.addEventListener('playing', exitBuffering);
    window.player.media.addEventListener('canplay', exitBuffering);
    window.player.media.addEventListener('canplaythrough', exitBuffering);
    window.player.media.addEventListener('seeked', () => {
      setTimeout(() => {
        if (!window.player.paused) exitBuffering();
        updateSessionCardAndProgress();
      }, 250);
    });
  }

  //   Polling Loop  :  This is The Important Part For YouTube Live Streams .
  if (uiPollIntervalId) clearInterval(uiPollIntervalId);
  uiPollIntervalId = setInterval(updateSessionCardAndProgress, 250);

  //   Initial Paint .
  updateSessionCardAndProgress();
};

//   Wrap Progress Events To Wait For Player Initialization .
window.startProgressTracking = function() {
  if (progressTrackingBound) return;
  progressTrackingBound = true;

  setInitialUI();

  window.player.on('timeupdate', updateSessionCardAndProgress);
  window.player.on('play', updateSessionCardAndProgress);
  window.player.on('pause', updateSessionCardAndProgress);
  window.player.on('seeked', updateSessionCardAndProgress);
  window.player.on('loadedmetadata', updateSessionCardAndProgress);
  window.player.on('ended', updateSessionCardAndProgress);
  window.player.on('statechange', updateSessionCardAndProgress);

  //   Immediate Sync So The Boxes Do Not Wait For The First Event .
  setTimeout(updateSessionCardAndProgress, 80);
};


//   🎊  Water Wave Effect Under Info Cards  ( Final Version )
//   -  Smooth Continuous Wave Animation  ( No Jitter )
//   -  Inner Water Circle Inset  ( With Gap Around It )
//   -  Outer Ring With Configurable Color
//   -  Water Wave Gradient Color Remains Constant
function createWaveCircle(
  containerId,
  color1 = "#6faeff",                 //   Top of Water Gradient
  color2 = "#1d5ee9",                 //   Bottom of Water Gradient
  ringColor = "#1d5ee9"               //   Only Outer Ring Color  ( Customizable )
) {
  const SIZE = 60;                    //   Total SVG Size
  const svgNS = "http://www.w3.org/2000/svg";
  const container = document.getElementById(containerId);

  //   Outer Ring Radius
  const outerR = SIZE / 2 - 2;
  //   Inner Circle Radius  ( For Water Area )  –  Slightly Smaller To Create The  " gap "
  const innerR = outerR - 4;          //   Gap Size  =  4px , Adjust If Needed

  //   Create SVG Container
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", SIZE);
  svg.setAttribute("height", SIZE);
  svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);

  //   ======  Defs  ( Gradient + Clip )  ======
  const defs = document.createElementNS(svgNS, "defs");

  //   Gradient For The Water
  const grad = document.createElementNS(svgNS, "linearGradient");
  grad.id = containerId + "grad";
  grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
  grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");

  const stop1 = document.createElementNS(svgNS, "stop");
  stop1.setAttribute("offset", "0%");
  stop1.setAttribute("stop-color", color1);
  const stop2 = document.createElementNS(svgNS, "stop");
  stop2.setAttribute("offset", "100%");
  stop2.setAttribute("stop-color", color2);

  grad.appendChild(stop1);
  grad.appendChild(stop2);
  defs.appendChild(grad);

  //   Clip - Path  ( Only Inside The Smaller Inner Circle )
  const clip = document.createElementNS(svgNS, "clipPath");
  clip.id = containerId + "clip";
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("cx", SIZE / 2);
  circle.setAttribute("cy", SIZE / 2);
  circle.setAttribute("r", innerR);
  clip.appendChild(circle);
  defs.appendChild(clip);

  svg.appendChild(defs);

  //   ======  Background Inner Circle  ======
  const bgCircle = document.createElementNS(svgNS, "circle");
  bgCircle.setAttribute("cx", SIZE / 2);
  bgCircle.setAttribute("cy", SIZE / 2);
  bgCircle.setAttribute("r", innerR);
  bgCircle.setAttribute("fill", "#fff");           //   White Background Behind Waves
  svg.appendChild(bgCircle);

  //   ======  Outer Ring  ======
  const outerRing = document.createElementNS(svgNS, "circle");
  outerRing.setAttribute("cx", SIZE / 2);
  outerRing.setAttribute("cy", SIZE / 2);
  outerRing.setAttribute("r", outerR);
  outerRing.setAttribute("fill", "none");
  outerRing.setAttribute("stroke", ringColor);     //   Configurable Ring Color
  outerRing.setAttribute("stroke-width", 2);
  svg.appendChild(outerRing);

  //   ======  Water Group  ( Clipped )  ======
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("clip-path", `url(#${clip.id})`);

  const wave1 = document.createElementNS(svgNS, "path");
  wave1.setAttribute("fill", `url(#${grad.id})`);
  wave1.setAttribute("fill-opacity", "0.6");

  const wave2 = document.createElementNS(svgNS, "path");
  wave2.setAttribute("fill", `url(#${grad.id})`);
  wave2.setAttribute("fill-opacity", "0.5");

  g.appendChild(wave1);
  g.appendChild(wave2);
  svg.appendChild(g);
  container.appendChild(svg);

  //   ======  Animation State  ======
  let targetProgress = 0;       //   Set By .update(progress)
  let smoothProgress = 0;       //   Lerped Value For Smooth Rise
  let phase1 = 0, phase2 = 0;

  //   Wave Generator Function
  function buildWave(width, amp, freq, phase, levelY) {
    const step = 1;             //   Smaller  =  Smoother ,  Bigger  =  Faster Performance
    let d = `M0 ${SIZE} `;
    for (let x = 0; x <= width; x += step) {
      const y = Math.sin((x / width) * freq * Math.PI * 2 + phase) * amp + levelY;
      d += `L${x},${y} `;
    }
    d += `L${width} ${SIZE} Z`;
    return d;
  }

  //   ======  Animation Loop  ======
  function animate() {
    //   Smoothly Interpolate Water Level
    smoothProgress += (targetProgress - smoothProgress) * 0.05;
    const levelY = SIZE - smoothProgress * SIZE;

    //   Advance Wave Phases
    phase1 -= 0.05;
    phase2 -= 0.07;

    //   Update Wave Paths
    wave1.setAttribute("d", buildWave(SIZE, 3, 2, phase1, levelY));
    wave2.setAttribute("d", buildWave(SIZE, 2, 1.5, phase2, levelY + 2));

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  //   ======  Public API  ======
  return {
    update(progress) {
      targetProgress = Math.max(0, Math.min(1, Number(progress) || 0));
    }
  };
}
  
//   Init After DOM
window.watchedWave = createWaveCircle("watchedWave", "#6faeff", "#1d5ee9", "#9c0892");     //   ✅ Pinkish Ring
window.remainingWave = createWaveCircle("remainingWave", "#6faeff", "#1d5ee9", "#874609");     //    ✅ Orange Ring
  
</script>
