      padding: var(--session-padding);

      transform: translateY(-2px) scale(0.99);
    }
    
    .session-header {
      display: flex;
      align-items: center;
      gap: 15px;                           /*   <--   Change  This  px  Value  To  Increase / Decrease  Dot - To - Text  Gap   */
      margin-bottom: var(--session-gap);
    }
    .session-dot {
      width: var(--session-dot-size);
      height: var(--session-dot-size);
      border-radius: 50%;

      box-shadow: 0 0 10px rgba(239, 68, 68, 0.55);
    }
    .session-title {
      font-size: var(--session-title-size);
      font-weight: var(--session-title-weight);
      color: var(--text-primary);
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    
    .session-row {
      display: flex;
      gap: 14px;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;

    .session-col {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;                    /*   Space  Between  Timer  &  Label   (  Use  0px – 2px  To  Bring  Closer  )   */

    .session-time {

    }

      color: var(--text-primary);            /*   Dark  Mode  Timer  Color   (  As  it  Was  )   */

    .session-label {
      font-size: var(--session-label-size);

    <button onclick="navigator.clipboard.writeText(document.getElementById('mobile-console').innerText).then(()=>alert('Logs Copied!'))" style="background:#14b9ff; color:white; border:none; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:bold;">Copy Logs</button>
  </div>
  <div id="mobile-console" style="background:#000; padding:10px; font-family:monospace; font-size:11px; height:250px; overflow-y:auto; border:1px solid #333; border-radius: 0 0 8px 8px; word-wrap:break-word;">

<script>
  //   Zero - Overhead  When  Off  ;   Add  " &debug=1 "  To  Any  Player  URL  Whenever  You  Want  Logs  Visible
  window.DEBUG_MODE = new URLSearchParams(window.location.search).has('debug');
  if (window.DEBUG_MODE) {
    const debugWrapper = document.getElementById('debugBoxWrapper');
    if (debugWrapper) debugWrapper.style.display = 'block';

    const logBox = document.getElementById('mobile-console');
    function printLog(msg, color) {
      if (logBox) {
        logBox.innerHTML += `<div style="color:${color}; margin-bottom:6px; border-bottom:1px solid #222; padding-bottom:4px;">${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }
    }
    const origLog = console.log, origErr = console.error, origWarn = console.warn;
    console.log = function(...args) { origLog(...args); printLog(args.join(' '), '#aaa'); };
    console.warn = function(...args) { origWarn(...args); printLog('WARN: ' + args.join(' '), '#ffaa00'); };
    console.error = function(...args) { origErr(...args); printLog('ERROR: ' + args.join(' '), '#ff5555'); };

    window.onerror = function(msg, url, line) {
      let errStr = msg;
      if (typeof msg === 'object' && msg !== null) {
        if (msg.type === 'error' && msg.detail && msg.detail.plyr) {
          const mErr = msg.detail.plyr.media?.error;
          errStr = `Plyr Media Crash | Code: ${mErr ? mErr.code : 'Unknown'}`;
        } else if (msg.type) {
          errStr = `Native Event(${msg.type}) ${msg.target?.error ? '| Code: ' + msg.target.error.code : ''}`;
        } else {
          try { errStr = JSON.stringify(msg); } catch(e) {}
        }
      }
      printLog(`FATAL: ${errStr} (Line: ${line || '?'})`, '#ff5555');
    };
  }

    const cleanKey = pair.slice(idx + 1).replace(/-/g, "").trim().toLowerCase();

  });

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [
    h > 0 ? h.toString().padStart(2, '0') : null,
    m.toString().padStart(2, '0'),

function escapeHTML(str) {
    if (!str) return "";
    return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'

    );
}

  console.error(`[${label}] Code: ${code} (Cat: ${category}) ${data ? "-> " + data : err.message || ""}`);
}

      if (apiUrl) {

        console.log(`[  DRM  ]   Loading   :   ${finalStreamUrl.substring(0, 80)}   🕊️  .......`);

    function toggleDarkMode(e) {
        const html = document.documentElement;
        const isDark = html.classList.contains('dark');
        const newTheme = isDark ? 'light' : 'dark';
        
        //   💾  Save  User's  Choice  Instantly  To  Memory
        localStorage.setItem('theme', newTheme);
        const btn = document.getElementById('themeToggle');

        //   🛡️  Fallback  For  Older  Browsers  That  Don't  Support  View  Transitions
        if (!document.startViewTransition) {
            html.classList.toggle('dark');
            if (btn) btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            const themeMeta = document.getElementById('theme-color-meta');
            if (themeMeta) themeMeta.content = newTheme === 'dark' ? '#111827' : '#f4f6fc';
            return;
        }

        const rect = btn ? btn.getBoundingClientRect() : null;
        let x, y;

        //   🎯  1.  Get  Precise  Touch  Coordinates
        if (e && typeof e.clientX === 'number' && typeof e.clientY === 'number' && (e.clientX !== 0 || e.clientY !== 0)) {
            // Strict Bounds Checker
            if (rect && (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom)) {
                x = rect.left + (rect.width / 2);
                y = rect.top + (rect.height / 2);
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            
            //   🎊  2.  The  Flawless  Address  Bar  Fix   (  Using  100vh  Trick  )
            if (window.matchMedia("(pointer: coarse)").matches) {
                const div = document.createElement('div');
                div.style.height = '100vh';
                div.style.position = 'absolute';
                div.style.visibility = 'hidden';
                div.style.zIndex = '-9999';
                document.body.appendChild(div);
                
                const addressBarHeight = Math.max(0, div.clientHeight - window.innerHeight);
                document.body.removeChild(div);
                
                if (addressBarHeight > 0) {
                    y = y + addressBarHeight;
                }
            }
        } else if (rect) {
            x = rect.left + (rect.width / 2);
            y = rect.top + (rect.height / 2);
        } else {
            x = window.innerWidth / 2;
            y = window.innerHeight / 2;
        }

        x = Math.round(x);
        y = Math.round(y);

        //   📐  3.  Math  Magic  :  Calculate  Distance  To  Furthest  Corner + Massive  400px  Safety  Buffer  !!
        const endRadius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) + 400;

        //   ⚡  Freeze  Background  SVG / Clock  DOM  Writes  During  Ripple  For  Native  60 / 120fps  GPU  Compositing
        window._isThemeTransitioning = true;

        //   📸  4.  Tell  The  Browser  To  Screenshot  The  Screen  &  Change  The  Theme  !!
        const transition = document.startViewTransition(() => {
            html.classList.toggle('dark');
            if (btn) btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        transition.finished.finally(() => {
            window._isThemeTransitioning = false;
        });

        //   🌊  5.  Execute  OS  Glitch  Protections  &  Animate  !!
        transition.ready.then(() => {
            setTimeout(() => {
                const themeMeta = document.getElementById('theme-color-meta');
                if (themeMeta) {
                    themeMeta.content = newTheme === 'dark' ? '#111827' : '#f4f6fc';
                }
            }, 50);

            requestAnimationFrame(() => {
                document.documentElement.animate(
                    { 
                        clipPath: [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`
                        ]
                    },
                    {
                        duration: 1400,                       
                        easing: 'ease-out', 
                        pseudoElement: '::view-transition-new(root)',
                        fill: 'forwards' 
                    }
                );
            });
        });
    }
    
    //   😇  Ensure  Button  Matches  Theme  On  Initial  Load
    document.addEventListener("DOMContentLoaded", () => {
        if (document.documentElement.classList.contains('dark')) {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = '☀️';
        }
    });


//   Gesture Logic NOT Affected
function initGestures(type) {
  setupGestureZone('gestureLeft', -10);
  setupGestureZone('gestureRight', 10);
  function setupGestureZone(zoneId, seekAmountDefault) {
    const zone = document.getElementById(zoneId);
    let lastTap = 0, isHolding = false, holdTimeout = null, startX = 0;
    let gestureStartTime = 0;
    zone.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      gestureStartTime = player.media.currentTime;
      isHolding = false;
      holdTimeout = setTimeout(() => isHolding = true, 1500);
    }, { passive: false });
    zone.addEventListener('touchmove', function(e) {
      if (isHolding) {
        let dx = e.touches[0].clientX - startX;
        let seekAmount = dx / 10;
        seekBy(seekAmount);
        let targetTime = gestureStartTime + seekAmount;
        let formattedTime = formatTime(targetTime);
        showToast(seekAmount > 0 ? `>> ${formattedTime}` : `<< ${formattedTime}`);
        vibrate();
        e.preventDefault();
      }
    }, { passive: false });
    zone.addEventListener('touchend', function(e) {
      clearTimeout(holdTimeout);
      const now = Date.now();
      if (!isHolding && now - lastTap < 300) {
        seekBy(seekAmountDefault);
        showToast(seekAmountDefault < 0 ? '⏪ -10s' : '⏩ +10s');
        vibrate();
      }
      lastTap = now;
      isHolding = false;
    });
    zone.addEventListener('dblclick', e => {
      e.preventDefault();
      e.stopPropagation();
    });
  }
}


function seekBy(seconds) {
  const c = player.media?.currentTime || 0;
  if (window.shakaPlayer && window.shakaPlayer.isLive()) {
    const range = window.shakaPlayer.seekRange();
    if (range && range.end > range.start) {
      player.media.currentTime = Math.max(range.start + 1, Math.min(range.end - 1, c + seconds));
      return;
    }
  }
  player.media.currentTime = Math.max(0, Math.min(player.media.duration || Infinity, c + seconds));
}

window._isDraggingShakaSeek = false;
function setupShakaLiveSeekBar() {
  const progressWrap = document.querySelector('.plyr__progress');
  const seekInput = progressWrap?.querySelector('input[data-plyr="seek"]');
  if (!progressWrap || !seekInput || progressWrap._shakaLiveBound) return;
  progressWrap._shakaLiveBound = true;

  const isShakaLive = () => Boolean(window.shakaPlayer && window.shakaPlayer.isLive());

  const startDrag = () => { if (isShakaLive()) window._isDraggingShakaSeek = true; };
  const endDrag = () => { window._isDraggingShakaSeek = false; };
  seekInput.addEventListener('pointerdown', startDrag, true);
  seekInput.addEventListener('touchstart', startDrag, true);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('touchend', endDrag);

  
  function handleShakaSeek(e) {
    if (!isShakaLive() || e.target !== seekInput) return;
    e.stopPropagation();

    const range = window.shakaPlayer.seekRange();
    const windowLen = range ? (range.end - range.start) : 0;
    if (windowLen <= 1) return;

    const pct = Math.max(0, Math.min(100, parseFloat(seekInput.value) || 0));
    seekInput.style.setProperty('--value', `${pct}%`);

    const targetTime = range.start + (pct / 100) * windowLen;
    if (window.player?.media) {
      window.player.media.currentTime = Math.max(range.start + 1, Math.min(range.end - 1, targetTime));
      const behind = Math.max(0, range.end - targetTime);
      showToast(behind <= 6 ? '🟢   LIVE'  :  `⏪  -${formatTime(behind)}`);
    }
  }

  //   Capture  On  Parent  Wrapper  So  it  Runs  Before  Plyr's  Own  Infinity  Seek  Handler
  progressWrap.addEventListener('input', handleShakaSeek, true);
  progressWrap.addEventListener('change', (e) => {
    handleShakaSeek(e);
    window._isDraggingShakaSeek = false;
  }, true);
}

  /* ---------- position helper: align menu above the interval button ---------- */
  function positionSeekMenu() {
  // show briefly for measurement, but keep hidden to avoid flicker
  seekIntervalMenu.style.display = 'block';
  seekIntervalMenu.style.visibility = 'hidden';
  seekIntervalMenu.classList.remove('menu-show');

  requestAnimationFrame(() => {
    const btnRect = intervalBtn.getBoundingClientRect();
    const menuWidth = seekIntervalMenu.offsetWidth;
    const menuHeight = seekIntervalMenu.offsetHeight;

    // horizontal nudge: tweak per device size (recalculated each time)
    // --- horizontal nudge (keep this, like in your current code) ---  
    const horizontalNudge = 33; // tweak to shift left/right  
    const verticalOffset = 15; // gap between button and menu (tweak to taste)

    // If menu is appended to body -> compute viewport coordinates
    if (seekIntervalMenu.parentElement === document.body) {
      let left = btnRect.left + window.scrollX + (btnRect.width / 2) - (menuWidth / 2) - horizontalNudge;
      // clamp to viewport
      left = Math.max(6, Math.min(left, window.innerWidth - menuWidth - 6));

      // place above the button; if not enough space, place below
      let top = btnRect.top + window.scrollY - menuHeight - verticalOffset;
      if (top < 6) top = btnRect.bottom + window.scrollY + verticalOffset;

      seekIntervalMenu.style.position = 'absolute';
      seekIntervalMenu.style.left = `${Math.round(left)}px`;
      seekIntervalMenu.style.top = `${Math.round(top)}px`;
      // ensure we clear bottom if previously used
      seekIntervalMenu.style.bottom = '';
    } else {
      // Menu is inside a parent (e.g. controls) — compute coords relative to that parent
      const parentRect = seekIntervalMenu.parentElement.getBoundingClientRect();

      // left relative to parent
      let left = (btnRect.left - parentRect.left) + (btnRect.width / 2) - (menuWidth / 2) - horizontalNudge;

      //   Clamp Inside Parent
      left = Math.max(6, Math.min(left, Math.max(6, parentRect.width - menuWidth - 6)));

      //   Top Relative To Parent  :  Place Above The Button .  If Not Enough Space ,  Place Below .
      let top = (btnRect.top - parentRect.top) - menuHeight - verticalOffset;
      if (top < 6) top = (btnRect.bottom - parentRect.top) + verticalOffset;

      seekIntervalMenu.style.position = 'absolute';
      seekIntervalMenu.style.left = `${Math.round(left)}px`;
      seekIntervalMenu.style.top = `${Math.round(top)}px`;
      seekIntervalMenu.style.bottom = '';
    }

    //   Restore Visibility  ( Menu - Show is Toggled Elsewhere To Animate )
    seekIntervalMenu.style.visibility = '';
  });
  }

  //   Re - Position  While Open If The Window is Resized
  ['resize', 'orientationchange', 'fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
    window.addEventListener(evt, () => {
      if (seekIntervalMenu.style.display !== 'none') {
        positionSeekMenu();
      }
    });
  });

  //   Place Right After Mute Button For Consistent Layout
  const muteBtn = controls.querySelector('[data-plyr="mute"]');
  muteBtn?.insertAdjacentElement('afterend', container);

  //   Hide Interval Menu On Outside Click
  document.addEventListener('click', function(ev){
    if (!seekIntervalMenu.contains(ev.target) &&
        ev.target !== intervalBtn
    ) {
      instantHideMenu(seekIntervalMenu);
      setIntervalBtnHighlight(false);            //   ✅  Reset Highlight On Outside Click
      //   Restore Gesture Zones When Menu Closes
      const gestureLeft = document.getElementById('gestureLeft');
      const gestureRight = document.getElementById('gestureRight');
      if (gestureLeft && gestureRight) {
        gestureLeft.style.pointerEvents = "auto";
        gestureRight.style.pointerEvents = "auto";
      }
    }
  });

  //   Handle Fullscreen Toggling: Move Menu To Best Parent & Reposition
  function handleFullscreenMove() {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (isFullscreen) {
      //   Append To The Plyr Root Wrapper  ( Fullscreen Element ) ,  Not Controls
      const plyrRoot = controls.closest('.plyr');
      plyrRoot.appendChild(seekIntervalMenu);
    } else {
      //   Back To Body So It Can Overflow Outside Player in Normal Mode
      document.body.appendChild(seekIntervalMenu);
    }

    if (seekIntervalMenu.style.display !== 'none') {
      requestAnimationFrame(positionSeekMenu);
    }
  }

  //   Listen For  Full - Screen  Changes  ( Standard + Webkit )
  document.addEventListener('fullscreenchange', handleFullscreenMove);
  document.addEventListener('webkitfullscreenchange', handleFullscreenMove);
}

function injectInlineVolumeSlider() {
  const controls = document.querySelector('.plyr__controls');
  if (!controls) return;
  if (document.getElementById('inlineVolumeSlider')) return;
  const muteBtn = controls.querySelector('[data-plyr="mute"]');
  if (!muteBtn) return;

  //   Create The Slider Container
  const volContainer = document.createElement('div');
  let volumeAutoHideTimeout = null;
  volContainer.id = 'inlineVolumeSlider';
  volContainer.style.display = 'none';
  volContainer.classList.add('menu-animate');

  //   Vertical Slider
  const volumeSlider = document.createElement('input');
  volumeSlider.type = 'range';
  volumeSlider.min = 0; volumeSlider.max = 1; volumeSlider.step = 0.01; volumeSlider.value = 1;

  volContainer.appendChild(volumeSlider);
  muteBtn.insertAdjacentElement('afterend', volContainer);

  //   Show Slider When  Mute / Volume  Button is Clicked ,  Set Volume To  100 %
  muteBtn.addEventListener('click', (e) => {
    e.preventDefault();

    const isOpen = volContainer.style.display === 'flex' && volContainer.classList.contains('menu-show');

    if (isOpen) {
      //   ✅  If Open ,  Hide Instantly & Clear Timer
      instantHideMenu(volContainer);
      muteBtn.style.background = '';
      if (volumeAutoHideTimeout) {
        clearTimeout(volumeAutoHideTimeout);
        volumeAutoHideTimeout = null;
      }
    } else {
      //   ✅  Show Volume Slider
      closeAllMenus('inlineVolumeSlider');
      player.muted = false;
      player.volume = 1;
      volumeSlider.value = 1;
      volContainer.style.display = 'flex';
      setTimeout(() => volContainer.classList.add('menu-show'), 10);
      muteBtn.style.background = '#14b9ff';       //   😍  <==  Apply Your Desired Background Color Here

      //   ✅  Clear Any Existing Timer Before Setting New One
      if (volumeAutoHideTimeout) clearTimeout(volumeAutoHideTimeout);
  
      //   ✅  Set New  Auto - Hide  Timer For 8 Seconds
      volumeAutoHideTimeout = setTimeout(() => {
        instantHideMenu(volContainer);
        muteBtn.style.background = '';
        volumeAutoHideTimeout = null;
      }, 8000);        //   ⏳  Auto Hides The Volume Slidebar After 8 Seconds
    }
  });

  //   Volume Slider Logic
  volumeSlider.addEventListener('input', function(){
    player.volume = this.value;
    player.muted = (Number(this.value) < 0.01);
  });

  player.on('volumechange', () => {
    volumeSlider.value = player.volume;
  });

  //   Hide Slider On Outside Click
  document.addEventListener('click', function(ev){
    if (!volContainer.contains(ev.target) &&
        ev.target !== muteBtn
    ) {
      instantHideMenu(volContainer);
      if (volumeAutoHideTimeout) {
        clearTimeout(volumeAutoHideTimeout);
        volumeAutoHideTimeout = null;
      }
      muteBtn.style.background = '';
    }
  });
}

//   ======  Current Session Card Logic  ( Improved )  ======
const sessionStatusDot = document.getElementById("sessionStatusDot");
const sessionCurrentTime = document.getElementById("sessionCurrentTime");
const sessionTotalDuration = document.getElementById("sessionTotalDuration");

let sessionTimer = null;
let watchedMilliseconds = 0;
let lastTick = null;

let isMetadataLoaded = false;
let isBufferingOrSeeking = false;

//   Watchdog Helpers ( Detect  " Stuck While Playing " )
let watchdogIntervalId = null;
let lastObservedTime = 0;
let timeStuckSince = null;
const TIME_STUCK_THRESHOLD_MS = 900;       //   If Time Hasn't Moved  >  Threshold  =>  Treat as Buffering
const WATCHDOG_INTERVAL_MS = 500;          //   Check Every 500ms

//   Format Time Helper → HH:MM:SS:MS
function formatSessionTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const milliseconds = Math.floor(ms % 1000 / 10);       //   Two - Digit  ms

  return [
    hours.toString().padStart(2, "0"),
    minutes.toString().padStart(2, "0"),
    seconds.toString().padStart(2, "0"),
  ].join(":") + ":" + milliseconds.toString().padStart(2, "0");
}

function setSessionDotState(state) {
  //   Clear  Possible  Classes  ,,   Then  Add  Exactly  One
  sessionStatusDot.classList.remove("bg-green-600", "bg-red-600", "bg-yellow-900");
  if (state === "playing") sessionStatusDot.classList.add("bg-green-600");
  else if (state === "buffering") sessionStatusDot.classList.add("bg-yellow-900");
  else sessionStatusDot.classList.add("bg-red-600");         //   Paused / Ended
}

//   Start  Counting  Watch  Time
function startSessionTimer() {
  if (sessionTimer) return;
  lastTick = Date.now();
  sessionTimer = setInterval(() => {
    if (window._isThemeTransitioning) return;
    const now = Date.now();
    //   Guard  Against  Negative  Diffs
    const delta = Math.max(0, now - lastTick);
    watchedMilliseconds += delta;
    lastTick = now;
    sessionCurrentTime.textContent = formatSessionTime(watchedMilliseconds);
  }, 50);        //   Update  Every  50ms   (  Same  as  Before  )
}

function stopSessionTimer() {
  if (!sessionTimer) return;
  clearInterval(sessionTimer);
  sessionTimer = null;
}

//   Enter  Buffering / Seeking  State  ( Stop Timer )
function enterBuffering() {
  if (isBufferingOrSeeking) return;
  isBufferingOrSeeking = true;
  //   Stop The Timer Immediately
  stopSessionTimer();
  //   Visually Indicate Buffering
  setSessionDotState("buffering");
}

//   Exit  Buffering / Seeking  State  ( Resume Timer Only If Actually Playing )
function exitBuffering() {
  if (!isBufferingOrSeeking) return;
  isBufferingOrSeeking = false;
  //   Restore Dot Based On Paused State
  setSessionDotState(player.paused ? "paused" : "playing");
  //   Resume Only if Actually Playing & Metadata Loaded
  if (!player.paused && isMetadataLoaded) {
    startSessionTimer();
  }
}


//   👇🏻  WRAP ALL SESSION EVENTS IN A FUNCTION SO THEY WAIT FOR PLAYER TO INITIALIZE
window.startSessionTracking = function() {
  console.log("[  DEBUG  ]   Session  Tracking  Successfully  Booted  .");
  
  //   Listen For  Metadata  -->  Show Total Duration  & Allow Timer To Start When Appropriate
  window.player.media?.addEventListener('loadedmetadata', () => {
    isMetadataLoaded = true;
    console.log("[DEBUG] Native loadedmetadata fired. Duration:", window.player.duration);
    if (window.player.duration) {
      const totalMs = Math.floor(window.player.duration * 1000);
      sessionTotalDuration.textContent = formatSessionTime(totalMs);
    }
    //   If Already Playing When Metadata Arrives ,  Start Timer
    if (!window.player.paused && !isBufferingOrSeeking) {
      startSessionTimer();
      setSessionDotState("playing");
    }
  });

  //   Plyr Events  :  Play / Pause / Ended
  window.player.on("play", () => {
    //   👇🏻  TIMER FIX  :  YouTube Suppresses Loadedmetadata Events On Live Streams .
    //   If The Video is Physically Playing ,  We Force  isMetadataLoaded  To True .
    console.log("[DEBUG] Player 'play' event triggered. Forcing metadata load state to true.");
    isMetadataLoaded = true; 
    setSessionDotState("playing");
    if (!isBufferingOrSeeking) {
        startSessionTimer();
        console.log("[DEBUG] Session timer explicitly started via 'play' event.");
    }
  });

  window.player.on("pause", () => {
    console.log("[DEBUG] Player paused. Stopping timer.");
    setSessionDotState("paused");
    stopSessionTimer();
  });

  window.player.on("ended", () => {
    setSessionDotState("paused");
    stopSessionTimer();
  });

  //   Buffer / Seeking  Related Events  ( Plyr - Level )
  window.player.on("seeking", enterBuffering);
  window.player.on("waiting", enterBuffering);
  window.player.on("stalled", enterBuffering);

  //   When Playback Actually Resumes ,  Clear Buffering State
  window.player.on("playing", exitBuffering);
  window.player.on("canplay", exitBuffering);
  window.player.on("canplaythrough", exitBuffering);

  //   Seeked is Sometimes Emitted Before  Playing / Canplay
  window.player.on("seeked", () => {
    setTimeout(() => {
      if (!window.player.paused) exitBuffering();
    }, 250);
  });

  //   Also Attach Native Media Events Where Available  ( HTML5 Path )
  if (window.player.media) {
    window.player.media.addEventListener('seeking', enterBuffering);
    window.player.media.addEventListener('waiting', enterBuffering);
    window.player.media.addEventListener('stalled', enterBuffering);
    window.player.media.addEventListener('playing', exitBuffering);
    window.player.media.addEventListener('canplay', exitBuffering);
    window.player.media.addEventListener('canplaythrough', exitBuffering);
    window.player.media.addEventListener('seeked', () => {
      setTimeout(() => {
        if (!window.player.paused) exitBuffering();
      }, 250);
    });
  }

  //   WATCHDOG  :  Detect  " Time Not Advancing While Player Claims to Be Playing "
  if (watchdogIntervalId) clearInterval(watchdogIntervalId);
  watchdogIntervalId = setInterval(() => {
    if (!isMetadataLoaded) return;

    if (window.player.paused || window.player.ended) {
      lastObservedTime = Number(window.player.currentTime || 0);
      timeStuckSince = null;
      return;
    }

    let cur = Number(window.player.currentTime || 0);
    
    //   👇🏻  WATCHDOG FIX  :  YouTube iframe API Desyncs Natively .  Extract Actual Time Directly From Google .
    if (window.player.provider === 'youtube' && window.player.embed && typeof window.player.embed.getCurrentTime === 'function') {
        const ytCur = Number(window.player.embed.getCurrentTime() || 0);
        if (ytCur > 0) cur = ytCur;
    }

    if (Math.abs(cur - lastObservedTime) < 0.05) {
      if (!timeStuckSince) timeStuckSince = Date.now();
      else if (Date.now() - timeStuckSince > TIME_STUCK_THRESHOLD_MS) {
        enterBuffering();
      }
    } else {
      timeStuckSince = null;
      if (isBufferingOrSeeking) exitBuffering();
    }
    lastObservedTime = cur;
  }, WATCHDOG_INTERVAL_MS);
};

//   ==========  Progress Cards  ( Watched / Remaining )  ==========
(function() {
  const leftFill = document.getElementById('leftProgressFill');         //   Watched Bar
  const rightFill = document.getElementById('rightProgressFill');       //   Remaining Bar
  const leftPercentEl = document.getElementById('leftPercent');
  const rightPercentEl = document.getElementById('rightPercent');

  if (!leftFill || !rightFill || !leftPercentEl || !rightPercentEl) {
    console.warn('Progress UI elements missing – progress cards disabled.');
    return;
  }

  //   Helper  :  Format  With  Leading Zero + 2 Decimals
  function formatPercent(value) {
    const fixed = value.toFixed(2);                     //   e.g.  -  " 3.50 "
    const [intPart, decPart] = fixed.split('.');
    const paddedInt = intPart.padStart(2, '0');         //   " 03 "
    return `${paddedInt}.${decPart}`;
  }


  //   Helper  :  Separate  Spans  For  Percent  Number  &  Label  Text
  function setPercentText(el, num, label) {
    el.innerHTML = `<span class="pct-num">${num} %</span>   <span class="pct-label">${label}</span>`;
  }

  //   Initial  UI   (  Before  Playback  Starts  or  At  0:00  )
  function setInitialUI() {
    leftFill.style.width = '0%';
    rightFill.style.width = '100%';
    setPercentText(leftPercentEl, '0', 'Watched');
    setPercentText(rightPercentEl, '100', 'Remaining');
  }
  

  //   👇🏻  THROTTLED  LOGGER  :  Prevents  The  Debug Box  From  Crashing  Your  Browser  While  Constantly  Updating
  let lastDebugLogTime = 0;

  //   ====================================================================================================
  //               🧠   THE  ULTIMATE  MATH  FIX   :   DECOUPLED  BACKGROUND  CALCULATIONS
  //   ====================================================================================================
  
  function updateProgressFromPlayer() {
    let dur = Number(player.duration || 0);
    let cur = Number(player.currentTime || 0);
    
    let isYtLive = false;
    let ytDrift = 0;

    //   👇🏻  YOUTUBE  IFRAME  API  EXTRACTION
    if (player.provider === 'youtube' && player.embed) {
        if (typeof player.embed.getVideoData === 'function') {
            isYtLive = player.embed.getVideoData().isLive || false;
        }
        
        if (typeof player.embed.getCurrentTime === 'function') {
            const ytCur = player.embed.getCurrentTime();
            if (ytCur > 0) cur = ytCur;
        }
        
        //   🚨  THE  1 - HOUR  BUG FIX  :  Google's  getDuration()  API Feeds Fake  1 - Hour  Offsets On  Live Streams !!
        //   We Completely Ban The Use of  getDuration()  If The  Stream  is Live .  We Only Use It For  VODs !!
        if (!isYtLive && typeof player.embed.getDuration === 'function') {
            const ytDur = player.embed.getDuration();
            if (ytDur > 0) dur = ytDur;
        }
    }

    //   ✅  NEW  HLS  FIX  :  Ensure  Custom  m3u8  Live  Streams  Are  Also  Tracked  Properly  !!
    if (dur === Infinity || (window.hls && window.hls.levels && window.hls.levels.length > 0 && window.hls.levels[window.hls.currentLevel === -1 ? 0 : window.hls.currentLevel]?.details?.live)) {
        isYtLive = true;
    }
    if (window.shakaPlayer && window.shakaPlayer.isLive()) {
        isYtLive = true;
    }

    if (isYtLive) {
        //   👇🏻  TRUE  REAL - TIME  TRACKER   (  Immune  To  Tab  Sleeping  )
        if (typeof window.ytMaxSeen === 'undefined') {
            window.ytMaxSeen = cur;
            window.lastRealTime = Date.now();
        }
        
        const nowTime = Date.now();
        const elapsedSecs = (nowTime - window.lastRealTime) / 1000;
        window.lastRealTime = nowTime;
        
        //   🚀  TAB  SLEEP  FIX  :  If  Elapsed  Time  is  " < 30s "  ,,   It's  a  Normal  Frame  Update  . 
        //   If  it's  Huge   (  E.g. -  5 Minutes  )  ,,   The  Tab  Was  Asleep  .   We  Ignore  Massive  Sleep  Jumps  !!
        if (elapsedSecs > 0 && elapsedSecs < 30) {
            window.ytMaxSeen += elapsedSecs;              //   The  Universe  Moves  Forward  Natively  !!
        }

        //   If  User  Seeks  Forward   (  Or  Auto - Snaps  To  Live  )  ,,   Instantly  Snap  The  Tracker  To  Reality
        if (cur > window.ytMaxSeen) {
            window.ytMaxSeen = cur;
        }

        //   HLS  Exception  :  HLS  Provides  a  Mathematically  Pure  Native  Live  Edge
        if (window.hls && window.hls.liveSyncPosition) {
            window.ytMaxSeen = window.hls.liveSyncPosition;
        }
        if (window.shakaPlayer && window.shakaPlayer.isLive()) {
            const range = window.shakaPlayer.seekRange();
            if (range && range.end > 0) window.ytMaxSeen = range.end;
        }

        dur = window.ytMaxSeen;
        ytDrift = Math.max(0, dur - cur);

        //   🚀  AUTO - SNAP  CACHE  BUSTER   (  Fixes  The  Random  17 - Hour  /  29 - Hour  Reload  Bug  )
        if (typeof window.initialYtLiveSeekDone === 'undefined' && !player.paused && cur > 0) {
            window.initialYtLiveSeekDone = true;
            if (player.provider === 'youtube' && player.embed && typeof player.embed.seekTo === 'function') {
                player.embed.seekTo(999999999, true);            //   Force  Google  Out  of  The  Cached  DVR  Window
                window.ytMaxSeen = 0;                            //   Force  Tracker  To  Reset  On  Next  Frame
                console.log("🚀   [  AUTO - SNAP  ]   Forcing  YouTube  To  True  Live  Edge  To  Clear  Bad  Cache  !!");
            }
        }
    }

    //   👇🏻  DEBUG  OUPUT  ( Throttled To Print Only Once Every  4 Seconds )
    const now = Date.now();
    if (now - lastDebugLogTime > 4000) {
        console.log(`[  STATE  ]  isLive  :  ${isYtLive}   |   ytDrift  :  ${ytDrift.toFixed(1)}   |   Dur  :  ${dur.toFixed(1)}   |   Cur  :  ${cur.toFixed(1)}   |   Paused  :  ${player.paused}`);
        lastDebugLogTime = now;
    }

    //   👇🏻  DYNAMIC  SESSION  CARD  LOGIC
    if (dur > 0 || isYtLive || cur > 0) {
        if (!isMetadataLoaded) isMetadataLoaded = true;
        
        //   Kickstart  The  Watched  Clock  if  Paused  State  is  False
        if (!player.paused && !isBufferingOrSeeking && !sessionTimer) {
            startSessionTimer();
            setSessionDotState("playing");
        }
        
        //   Format  The  Actual  Total  Duration  Perfectly   (  Now  Immune  To  1 - Hour  Offsets  )
        if (isYtLive) {
            if (dur > 0 && dur < 86400 * 30) {
                document.getElementById("sessionTotalDuration").textContent = formatSessionTime(Math.floor(dur * 1000));
            } else {
                document.getElementById("sessionTotalDuration").textContent = "Live Stream";
            }
        } else if (dur === Infinity) {
            document.getElementById("sessionTotalDuration").textContent = "Live Stream";
        } else {
            document.getElementById("sessionTotalDuration").textContent = formatSessionTime(Math.floor(dur * 1000));
        }
    }

    //   Early  Exit  Trap  :  Only  Quit  if  it's  a  VOD  &  Truly  Has  0   Duration
    if (!isYtLive && (!dur || !isFinite(dur) || dur === 0)) {
        checkLiveDrift(cur, dur, isYtLive, ytDrift);
        return;
    }

    //   👇🏻  BUTTERY  SMOOTH  PERCENTAGE  MATH  
    let frac = (dur > 0) ? Math.max(0, Math.min(1, cur / dur)) : 1;
    let watchedPct = frac * 100;
    let remPct = 100 - watchedPct;

    if (isYtLive) {
        //   For  Any  Live  Stream  ,,   Show  100 / 0  Unless  Scrubbed  Back  Significantly   (  > 15s  )
        if (ytDrift > 15) {
            leftFill.style.width = `${watchedPct.toFixed(2)}%`;
            rightFill.style.width = `${remPct.toFixed(2)}%`;
            setPercentText(leftPercentEl, formatPercent(watchedPct), 'Watched');
            setPercentText(rightPercentEl, formatPercent(remPct), 'Remaining');
        } else {
            leftFill.style.width = '100%';
            rightFill.style.width = '0%';
            setPercentText(leftPercentEl, '100', 'Watched');
            setPercentText(rightPercentEl, '0', 'Remaining');
        }
    } else {
        //   Normal  VOD  Percentage  Logic
        if (cur === 0) {
            leftFill.style.width = '0%';
            rightFill.style.width = '100%';
            setPercentText(leftPercentEl, '0', 'Watched');
            setPercentText(rightPercentEl, '100', 'Remaining');
        } else if (Math.abs(cur - dur) < 0.01 || watchedPct >= 100) {
            leftFill.style.width = '100%';
            rightFill.style.width = '0%';
            setPercentText(leftPercentEl, '100', 'Watched');
            setPercentText(rightPercentEl, '0', 'Remaining');
        } else {
            leftFill.style.width = `${watchedPct.toFixed(3)}%`;  
            rightFill.style.width = `${remPct.toFixed(3)}%`;
            setPercentText(leftPercentEl, formatPercent(watchedPct), 'Watched');
            setPercentText(rightPercentEl, formatPercent(remPct), 'Remaining');
        }
    }

    if (window.watchedWave) window.watchedWave.update(isYtLive && (ytDrift <= 15) ? 1 : frac);
    if (window.remainingWave) window.remainingWave.update(isYtLive && (ytDrift <= 15) ? 0 : 1 - frac);
    
    checkLiveDrift(cur, dur, isYtLive, ytDrift);

    //   🚀  SHAKA  LIVE  DVR  SLIDER  SYNC
    const isShakaLive = Boolean(window.shakaPlayer && window.shakaPlayer.isLive());
    if (isShakaLive && !window._isDraggingShakaSeek) {
        const range = window.shakaPlayer.seekRange();
        const seekInput = document.querySelector('.plyr__progress input[data-plyr="seek"]');
        if (seekInput && range && (range.end - range.start) > 1) {
            const pct = Math.max(0, Math.min(100, ((cur - range.start) / (range.end - range.start)) * 100));
            requestAnimationFrame(() => {
                if (window._isDraggingShakaSeek) return;
                seekInput.value = pct;
                seekInput.style.setProperty('--value', `${pct}%`);
            });
        }
    }

    //   🚀  THE  NATIVE  " - 59:54 "  OVERRIDE  FIX
    //   Plyr  Natively  Calculates  Remaining  Time  INTERNALLY  &  Drifts  Wildly  When  The  Tab  Sleeps  .
    //   We  Use  Our  Pure   API  Math  To  Forcefully  Overwrite  The  Broken  Numbers  On  The  Screen  !!
    const shakaRange = isShakaLive ? window.shakaPlayer.seekRange() : null;
    const shakaWindowLen = shakaRange ? Math.max(0, shakaRange.end - shakaRange.start) : 0;
    const shakaPosInWindow = shakaRange ? Math.max(0, Math.min(shakaWindowLen, cur - shakaRange.start)) : 0;

    const curEl = document.querySelector('.plyr__time--current');
    if (curEl) {
        if (isShakaLive) {
            curEl.textContent = window._isTimeInverted
                ? '-' + formatTime(Math.floor(ytDrift))
                : formatTime(Math.floor(shakaPosInWindow));
        } else {
            if (window._isTimeInverted) {
                const remainingSecs = isYtLive ? ytDrift : Math.max(0, dur - cur);
                curEl.textContent = '-' + formatTime(Math.floor(remainingSecs));
            } else {
                curEl.textContent = formatTime(Math.floor(cur));
            }
        }
    }

    const durEl = document.querySelector('.plyr__time--duration');
    if (durEl) {
        durEl.textContent = isShakaLive ? formatTime(Math.floor(shakaWindowLen)) : formatTime(Math.floor(dur));
    }
  }


  function checkLiveDrift(cur, dur, isYtLive, ytDrift) {
    const liveIndicator = document.getElementById('liveIndicator');
    const liveIndicatorText = document.getElementById('liveIndicatorText');
    const liveIndicatorDot = document.getElementById('liveIndicatorDot');
    
    if (!liveIndicator) return;

    let isLive = isYtLive;
    let liveEdgeTime = dur;

    //   1.  Detect HLS Streams  ( PW / Custom M3U8 )
    if (window.hls && window.hls.levels && window.hls.levels.length > 0) {
        const levelIndex = window.hls.currentLevel === -1 ? 0 : window.hls.currentLevel;
        const currentLevel = window.hls.levels[levelIndex];
        
        if (currentLevel && currentLevel.details && currentLevel.details.live) {
            isLive = true;
            liveEdgeTime = window.hls.liveSyncPosition || dur;
        }
    } else if (dur === Infinity) {
        isLive = true;
    }

    //   SMART TOGGLE  :  Hide Completely If It's a Normal  MP4 or YouTube VOD
    if (!isLive) {
        liveIndicator.style.display = 'none';
        return;
    }

    //   Stream is Live .  Ensure Button is Visible .
    liveIndicator.style.display = 'flex';

    //   👇🏻  YOUTUBE DRIFT BYPASS FIX  :  Mathematically Calculate Drift Against Our  High - Water  Mark Tracker
    if (isYtLive) {
        //   If They Are Within 18 Seconds of Our  Real - Time  Tracker Edge ,  They Are Live
        if (ytDrift <= 18) {
            liveIndicatorText.textContent = "LIVE";
            liveIndicatorText.style.color = "#16a34a";
            liveIndicatorDot.style.backgroundColor = "#16a34a";
            liveIndicatorDot.style.boxShadow = "0 0 5px #16a34a";
        } else {
            liveIndicatorText.textContent = "NOT LIVE";
            liveIndicatorText.style.color = "#ef4444";
            liveIndicatorDot.style.backgroundColor = "#ef4444";
            liveIndicatorDot.style.boxShadow = "0 0 5px #ef4444";
        }
        return;
    }
    
    //   Mathematical  Drift  Check  Specifically  For  PW  HLS  Streams
    const secondsBehind = liveEdgeTime - cur;
    
    //   12 - Second  Tolerance  For  PW  Streams
    if (secondsBehind <= 12) { 
        liveIndicatorText.textContent = "LIVE";
        liveIndicatorText.style.color = "#16a34a";
        liveIndicatorDot.style.backgroundColor = "#16a34a";
        liveIndicatorDot.style.boxShadow = "0 0 5px #16a34a";
    } else {
        liveIndicatorText.textContent = "NOT  LIVE";
        liveIndicatorText.style.color = "#ef4444";
        liveIndicatorDot.style.backgroundColor = "#ef4444";
        liveIndicatorDot.style.boxShadow = "0 0 5px #ef4444";
    }
  }

  //   Make  The  Live  Indicator  Button  Clickable  To  Forcefully  Jump  Back  To  Live  Edge
  const liveInd = document.getElementById('liveIndicator');
  if (liveInd) {
      liveInd.addEventListener('click', () => {
          if (!window.player) return;
          
          const isYtLive = (window.player.provider === 'youtube' && window.player.embed && typeof window.player.embed.getVideoData === 'function' && window.player.embed.getVideoData().isLive);

          if (window.shakaPlayer && window.shakaPlayer.isLive()) {
              const range = window.shakaPlayer.seekRange();
              if (range && range.end > 0) window.player.currentTime = Math.max(range.start, range.end - 2);
          } else if (window.hls && window.hls.liveSyncPosition) {
              window.player.currentTime = window.hls.liveSyncPosition;
          } else if (isYtLive && window.player.embed && window.player.embed.seekTo) {
              //   👇🏻  YOUTUBE  JUMP  BYPASS  :  Seek  Using  Google's  Legendary  999999999  Trick  !!
              //   By  Seeking  To  an  Impossibly  High  Number  ,,   Google's  Engine  Forcibly  Caps  it  at  The  Exact  True  Live  Edge  .
              window.player.embed.seekTo(999999999, true);
          } else if (window.player.duration && window.player.duration !== Infinity) {
              window.player.currentTime = window.player.duration;
          }
      });
  }

  
  //   👇🏻  WRAP  PROGRESS  EVENTS  TO  WAIT  FOR  PLAYER  INITIALIZATION
  window.updateProgressFromPlayer = updateProgressFromPlayer;

  window.startProgressTracking = function() {
    setInitialUI();
    window.player.on('timeupdate', updateProgressFromPlayer);
    window.player.on('play', updateProgressFromPlayer);
    window.player.on('seeking', updateProgressFromPlayer);
    window.player.on('seeked', updateProgressFromPlayer);
    window.player.on('durationchange', updateProgressFromPlayer);
    window.player.on('loadedmetadata', updateProgressFromPlayer);
    window.player.on('ended', updateProgressFromPlayer);
    setTimeout(updateProgressFromPlayer, 80);

    //   👇🏻  PROGRESSIVE  DOWNLOAD  TRACKER  :  Only  Runs  When  " &debug=1 "  is  Active
    if (window.DEBUG_MODE) {
      setInterval(() => {
          if (!window.player || !window.player.media) return;
          const vid = window.player.media;
          if (vid.buffered.length > 0 && Number.isFinite(vid.duration) && vid.duration > 0) {
              const bufferedSeconds = vid.buffered.end(vid.buffered.length - 1);
              const percent = ((bufferedSeconds / vid.duration) * 100).toFixed(1);
              if (percent < 99.9) {
                  console.log(`[  NETWORK  ]   Buffered  :  ${percent}%  (${Math.floor(bufferedSeconds)}s  of  ${Math.floor(vid.duration)}s)`);
              }
          }
      }, 5000);
    }

    
    //   👇🏻  EVENT  SUPPRESSION  FIX  :  Google's  iframe   Frequently  Blocks  The  " timeupdate "  Event  On  Live  Streams  .
    //   If  The  Event  Doesn't  Fire  ,,   The  Omni - Scraper  Never  Runs  .   This  Forces  it  To  Run  Every  1 - Second  .
    setInterval(() => {
        if (window.player && !window.player.paused) {
            updateProgressFromPlayer();
        }
    }, 1000);
  };
})();


//   🎊  Water Wave Effect Under Info Cards  ( Final Version )
//   -  Smooth Continuous Wave Animation  ( No Jitter )
//   -  Inner Water Circle Inset  ( With Gap Around It )
//   -  Outer Ring With Configurable Color
//   -  Water Wave Gradient Color Remains Constant
function createWaveCircle(
  containerId,
  color1 = "#6faeff",                 //   Top of Water Gradient
  color2 = "#1d5ee9",                 //   Bottom of Water Gradient
  ringColor = "#1d5ee9"               //   Only Outer Ring Color  ( Customizable )
) {
  const SIZE = 60;                    //   Total SVG Size
  const svgNS = "http://www.w3.org/2000/svg";
  const container = document.getElementById(containerId);

  //   Outer Ring Radius
  const outerR = SIZE / 2 - 2;
  //   Inner Circle Radius  ( For Water Area )  –  Slightly Smaller To Create The  " gap "
  const innerR = outerR - 4;          //   Gap Size  =  4px , Adjust If Needed

  //   Create SVG Container
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", SIZE);
  svg.setAttribute("height", SIZE);
  svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);

  //   ======  Defs  ( Gradient + Clip )  ======
  const defs = document.createElementNS(svgNS, "defs");

  //   Gradient For The Water
  const grad = document.createElementNS(svgNS, "linearGradient");
  grad.id = containerId + "grad";
  grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
  grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");

  const stop1 = document.createElementNS(svgNS, "stop");
  stop1.setAttribute("offset", "0%");
  stop1.setAttribute("stop-color", color1);
  const stop2 = document.createElementNS(svgNS, "stop");
  stop2.setAttribute("offset", "100%");
  stop2.setAttribute("stop-color", color2);

  grad.appendChild(stop1);
  grad.appendChild(stop2);
  defs.appendChild(grad);

  //   Clip - Path  ( Only Inside The Smaller Inner Circle )
  const clip = document.createElementNS(svgNS, "clipPath");
  clip.id = containerId + "clip";
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("cx", SIZE / 2);
  circle.setAttribute("cy", SIZE / 2);
  circle.setAttribute("r", innerR);
  clip.appendChild(circle);
  defs.appendChild(clip);

  svg.appendChild(defs);

  //   ======  Background Inner Circle  ======
  const bgCircle = document.createElementNS(svgNS, "circle");
  bgCircle.setAttribute("cx", SIZE / 2);
  bgCircle.setAttribute("cy", SIZE / 2);
  bgCircle.setAttribute("r", innerR);
  bgCircle.setAttribute("fill", "#fff");           //   White Background Behind Waves
  svg.appendChild(bgCircle);

  //   ======  Outer Ring  ======
  const outerRing = document.createElementNS(svgNS, "circle");
  outerRing.setAttribute("cx", SIZE / 2);
  outerRing.setAttribute("cy", SIZE / 2);
  outerRing.setAttribute("r", outerR);
  outerRing.setAttribute("fill", "none");
  outerRing.setAttribute("stroke", ringColor);     //   Configurable Ring Color
  outerRing.setAttribute("stroke-width", 2);
  svg.appendChild(outerRing);

  //   ======  Water Group  ( Clipped )  ======
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("clip-path", `url(#${clip.id})`);

  const wave1 = document.createElementNS(svgNS, "path");
  wave1.setAttribute("fill", `url(#${grad.id})`);
  wave1.setAttribute("fill-opacity", "0.6");

  const wave2 = document.createElementNS(svgNS, "path");
  wave2.setAttribute("fill", `url(#${grad.id})`);
  wave2.setAttribute("fill-opacity", "0.5");

  g.appendChild(wave1);
  g.appendChild(wave2);
  svg.appendChild(g);
  container.appendChild(svg);

  //   ======  Animation State  ======
  let targetProgress = 0;       //   Set By .update(progress)
  let smoothProgress = 0;       //   Lerped Value For Smooth Rise
  let phase1 = 0, phase2 = 0;

  //   Wave Generator Function
  function buildWave(width, amp, freq, phase, levelY) {
    const step = 1;             //   Smaller  =  Smoother ,  Bigger  =  Faster Performance
    let d = `M0 ${SIZE} `;
    for (let x = 0; x <= width; x += step) {
      const y = Math.sin((x / width) * freq * Math.PI * 2 + phase) * amp + levelY;
      d += `L${x},${y} `;
    }
    d += `L${width} ${SIZE} Z`;
    return d;
  }

  //   ======   Animation  Loop   ======
  function animate() {
    if (!window._isThemeTransitioning) {
      //   Smoothly  Interpolate  Water  Level
      smoothProgress += (targetProgress - smoothProgress) * 0.05;
      const levelY = SIZE - smoothProgress * SIZE;

      //   Advance  Wave  Phases
      phase1 -= 0.05;
      phase2 -= 0.07;

      //   Update  Wave  Paths
      wave1.setAttribute("d", buildWave(SIZE, 3, 2, phase1, levelY));
      wave2.setAttribute("d", buildWave(SIZE, 2, 1.5, phase2, levelY + 2));
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  //   ======  Public API  ======
  return {
    update(progress) {
      targetProgress = Math.max(0, Math.min(1, Number(progress) || 0));
    }
  };
}
  
//   Init After DOM
window.watchedWave = createWaveCircle("watchedWave", "#6faeff", "#1d5ee9", "#9c0892");     //   ✅ Pinkish Ring
window.remainingWave = createWaveCircle("remainingWave", "#6faeff", "#1d5ee9", "#874609");     //    ✅ Orange Ring
  
</script>
