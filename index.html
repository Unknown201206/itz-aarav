<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaRAv OffiCiaL - Link Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    body { background-color: #0f172a; color: white; overscroll-behavior: none; }
    .neon-box {
      border: 1px solid #6b21a8;
      box-shadow: 0 0 15px rgba(107, 33, 168, 0.5);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }
    .neon-btn {
      background: linear-gradient(90deg, #9c0892, #2d0a5e);
      box-shadow: 0 4px 15px rgba(156, 8, 146, 0.4);
      transition: all 0.2s ease;
    }
    .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(156, 8, 146, 0.6); }
    .neon-btn:active { transform: translateY(1px); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!--   Header   -->
  <div class="text-center mb-8">
    <img src="feather-transparent.png" alt="Feather" class="w-32 mx-auto object-contain -mb-4 rotate-[-25deg] scale-x-[0.9]" onerror="this.style.display='none'">
    <h2 class="bg-gradient-to-r from-pink-500 to-blue-500 bg-clip-text text-transparent text-2xl sm:text-3xl font-bold mt-2">AaRAv OffiCiaL</h2>
    <p class="text-gray-400 text-sm mt-1 font-semibold tracking-widest">SMART LINK CONVERTER</p>
  </div>

  <!--   Input Section   -->
  <div class="w-full max-w-lg neon-box rounded-xl p-6 mb-6">
    <label class="block text-sm font-bold text-purple-300 mb-2">Paste Raw Video Link (PW, MP4, M3U8, YouTube):</label>
    <div class="flex gap-2">
      <input type="text" id="rawLink" placeholder="https://..." class="w-full bg-gray-900 border border-purple-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-pink-500">
      <button onclick="pasteFromClipboard()" class="bg-gray-800 border border-gray-600 rounded-lg px-4 text-xs font-bold hover:bg-gray-700 transition">PASTE</button>
    </div>
    <button onclick="convertLink()" class="neon-btn w-full mt-4 py-3 rounded-lg text-white font-bold text-sm tracking-wider">CONVERT LINK</button>
  </div>

  <!--   Output Section  ( Hidden By Default )   -->
  <div id="outputSection" class="w-full max-w-lg neon-box rounded-xl p-6 hidden">
    <label class="block text-sm font-bold text-green-400 mb-2">Ready to Play URL:</label>
    <textarea id="finalUrl" readonly class="w-full bg-gray-900 border border-green-800 rounded-lg p-3 text-sm text-green-300 h-24 resize-none focus:outline-none mb-4"></textarea>
    
    <div class="flex gap-3">
      <button onclick="copyLink()" class="flex-1 bg-gray-800 border border-gray-600 rounded-lg py-3 text-sm font-bold hover:bg-gray-700 transition">📄 COPY LINK</button>
      <button onclick="playVideo()" class="flex-1 neon-btn rounded-lg py-3 text-sm font-bold">▶ PLAY NOW</button>
    </div>
  </div>

  <script>
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('rawLink').value = text;
      } catch (err) {
        alert("Clipboard permission denied. Please paste manually.");
      }
    }

    function convertLink() {
      const rawUrl = document.getElementById('rawLink').value.trim();
      if (!rawUrl) return alert('Please paste a link first!');

      let provider = '';
      let videoParam = '';
      let videoID = '';

      try {
        //   1.  YouTube Logic
        if (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
          provider = 'youtube';
          const urlObj = new URL(rawUrl.replace('youtu.be/', 'youtube.com/watch?v='));
          videoID = urlObj.searchParams.get('v');
          if (!videoID) throw new Error("Invalid YouTube Link");
        } 
        //   2.  PW / Heroku  Protected Stream Logic
        else if (rawUrl.includes('live-server') || rawUrl.includes('herokuapp.com') || rawUrl.includes('/pw/live')) {
          provider = 'hls';
          const urlObj = new URL(rawUrl);
          //   Strip Domain ,  Extract Path + Token ,  Replace  " /pw/live "  With  " /live "  For Direct Proxy Access
          let pathAndQuery = urlObj.pathname + urlObj.search;
          pathAndQuery = pathAndQuery.replace('/pw/live', '/live');
          
          const proxyPath = '/stream-proxy' + pathAndQuery; 
          videoParam = encodeURIComponent(proxyPath);
        }
        //   3.  Generic Public M3U8 Logic
        else if (rawUrl.includes('.m3u8')) {
          provider = 'hls';
          videoParam = encodeURIComponent(rawUrl);
        }
        //   4.  Fallback HTML5  ( MP4 , Archive.org ,   etc. )
        else {
          provider = 'html5';
          videoParam = encodeURIComponent(rawUrl);
        }

        //   Build Final Vercel URL
        //   window.location.origin  Grabs Your Current Domain  ( e.g., https://itz-aarav.vercel.app )
        let baseUrl = window.location.origin + '/video-player.html';
        let finalUrl = `${baseUrl}?provider=${provider}`;
        
        if (provider === 'youtube') finalUrl += `&videoID=${videoID}`;
        else finalUrl += `&video=${videoParam}`;

        document.getElementById('finalUrl').value = finalUrl;
        document.getElementById('outputSection').classList.remove('hidden');

      } catch (error) {
        alert("Error parsing link. Make sure it is a valid URL.");
        console.error(error);
      }
    }

    function copyLink() {
      const urlBox = document.getElementById('finalUrl');
      urlBox.select();
      document.execCommand('copy');
      alert('Link Copied to Clipboard!');
    }

    function playVideo() {
      const finalUrl = document.getElementById('finalUrl').value;
      if (finalUrl) window.location.href = finalUrl;
    }
  </script>
</body>
</html>
